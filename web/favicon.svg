<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#4B2596"></stop>
      <stop offset="0.45" stop-color="#1E0B4E"></stop>
      <stop offset="1" stop-color="#070218"></stop>
    </radialGradient>

    
    <linearGradient id="cube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEAB0"></stop>
      <stop offset="0.5" stop-color="#FFC957"></stop>
      <stop offset="1" stop-color="#B86E10"></stop>
    </linearGradient>

    
    <linearGradient id="topHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.95)"></stop>
      <stop offset="1" stop-color="rgba(255,255,255,0)"></stop>
    </linearGradient>

    
    <linearGradient id="botSh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(120,60,0,0)"></stop>
      <stop offset="1" stop-color="rgba(80,40,0,0.55)"></stop>
    </linearGradient>

    
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="rgba(255,210,140,0.35)"></stop>
      <stop offset="0.5" stop-color="rgba(255,210,140,0.08)"></stop>
      <stop offset="1" stop-color="rgba(255,210,140,0)"></stop>
    </linearGradient>

    
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,201,87,0.5)"></stop>
      <stop offset="1" stop-color="rgba(255,201,87,0)"></stop>
    </radialGradient>

    
    <radialGradient id="starG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,255,255,1)"></stop>
      <stop offset="0.4" stop-color="rgba(255,255,255,0.5)"></stop>
      <stop offset="1" stop-color="rgba(255,255,255,0)"></stop>
    </radialGradient>

    
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,201,87,0.32)"></stop>
      <stop offset="0.55" stop-color="rgba(255,140,60,0.12)"></stop>
      <stop offset="1" stop-color="rgba(255,201,87,0)"></stop>
    </radialGradient>

    
    <filter id="cubeDrop" x="-40%" y="-20%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="22"></feGaussianBlur>
    </filter>

    
    <clipPath id="cubeClip">
      <rect x="290" y="296" width="444" height="444" rx="100"></rect>
    </clipPath>
  </defs>

  
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"></rect>

  
  <g>
    <circle cx="140" cy="180" r="14" fill="url(#starG)" opacity="0.7"></circle>
    <circle cx="880" cy="140" r="20" fill="url(#starG)" opacity="0.9"></circle>
    <circle cx="820" cy="820" r="16" fill="url(#starG)" opacity="0.7"></circle>
    <circle cx="180" cy="780" r="12" fill="url(#starG)" opacity="0.6"></circle>
    <circle cx="510" cy="120" r="10" fill="url(#starG)" opacity="0.65"></circle>
    <circle cx="940" cy="510" r="9" fill="url(#starG)" opacity="0.55"></circle>
    <circle cx="86" cy="510" r="9" fill="url(#starG)" opacity="0.55"></circle>
  </g>

  
  <circle cx="512" cy="512" r="370" fill="url(#halo)"></circle>

  
  <ellipse cx="512" cy="850" rx="240" ry="34" fill="url(#ground)"></ellipse>

  
  <ellipse cx="512" cy="800" rx="200" ry="22" fill="rgba(0,0,0,0.5)" filter="url(#cubeDrop)"></ellipse>

  
  <g>
    
    <rect x="290" y="296" width="444" height="444" rx="100" fill="url(#cube)"></rect>

    <g clip-path="url(#cubeClip)">
      
      <rect x="290" y="296" width="444" height="320" fill="url(#beam)"></rect>

      
      
      <rect x="290" y="540" width="444" height="200" fill="url(#botSh)"></rect>

      
      
      <g fill="#1a1408">
        <ellipse cx="426" cy="510" rx="24" ry="32"></ellipse>
        <ellipse cx="598" cy="510" rx="24" ry="32"></ellipse>
      </g>
      
      <g fill="#fff">
        <circle cx="434" cy="498" r="8"></circle>
        <circle cx="606" cy="498" r="8"></circle>
      </g>

      
      
      <path d="M 452 612 Q 512 656 572 612" stroke="#1a1408" stroke-width="18" stroke-linecap="round" fill="none"></path>
    </g>

    
    <rect x="290" y="296" width="444" height="444" rx="100" fill="none" stroke="#5A3505" stroke-width="14"></rect>

    
    
  </g>

  
  <g fill="#FFE9A8" opacity="0">
  </g>
</svg>